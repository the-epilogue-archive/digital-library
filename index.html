<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Epilogue Archive — Confidential Dossier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14110d;
            --paper: #e9ddc1;
            --paper-2: #d8caa8;
            --paper-line: rgba(90, 70, 40, 0.12);
            --ink: #2a2118;
            --ink-soft: #5a4a36;
            --red: #8a2828;
            --stamp: #7a1f1f;
            --gold: #b8915a;
            --gold-bright: #d4a24c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cormorant Garamond', 'Noto Serif Bengali', Georgia, serif;
            color: var(--paper);
            background: var(--bg);
            min-height: 100vh;
            padding: 60px 24px 80px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(184, 145, 90, 0.09) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(122, 31, 31, 0.07) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* ====== HEADER ====== */
        header {
            max-width: 900px;
            margin: 0 auto 55px;
            text-align: center;
            position: relative;
            animation: fadeDown 0.7s ease both;
        }

        .dept-line {
            font-family: 'Special Elite', monospace;
            font-size: 0.68rem;
            letter-spacing: 5px;
            color: rgba(233, 221, 193, 0.5);
            text-transform: uppercase;
            margin-bottom: 22px;
        }
        .dept-line::before,
        .dept-line::after {
            content: "· · ·";
            margin: 0 14px;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        h1 {
            font-family: 'Special Elite', serif;
            font-size: clamp(1.9rem, 5vw, 3.2rem);
            font-weight: 400;
            letter-spacing: 3px;
            color: var(--paper);
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 16px;
            text-shadow: 0 0 30px rgba(233, 221, 193, 0.08);
        }

        .case-sub {
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
            color: rgba(233, 221, 193, 0.6);
            letter-spacing: 1px;
            transform: rotate(-1deg);
            display: inline-block;
        }

        .header-stamp {
            position: absolute;
            top: -6px;
            right: 4%;
            transform: rotate(12deg);
            font-family: 'Special Elite', serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--stamp);
            border: 2.5px solid var(--stamp);
            padding: 5px 12px;
            border-radius: 2px;
            opacity: 0.75;
            text-transform: uppercase;
        }

        /* ====== SEARCH ====== */
        .search-wrap {
            max-width: 540px;
            margin: 0 auto 55px;
            position: relative;
            animation: fadeUp 0.7s ease 0.1s both;
        }
        .search-wrap label {
            display: block;
            font-family: 'Special Elite', serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: rgba(233, 221, 193, 0.45);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 46px 14px 20px;
            background: var(--paper);
            border: none;
            border-radius: 2px;
            color: var(--ink);
            font-family: 'Special Elite', 'Noto Serif Bengali', monospace;
            font-size: 0.92rem;
            letter-spacing: 0.5px;
            outline: none;
            box-shadow: 0 6px 18px -6px rgba(0,0,0,0.6);
            transition: box-shadow 0.25s ease;
        }
        .search-wrap input::placeholder {
            color: rgba(42, 33, 24, 0.4);
            font-style: italic;
        }
        .search-wrap input:focus {
            box-shadow: 0 6px 22px -4px rgba(212, 162, 76, 0.35), 0 0 0 1px rgba(212, 162, 76, 0.5);
        }
        .search-wrap::after {
            content: "⌕";
            position: absolute;
            right: 18px;
            bottom: 11px;
            font-size: 1.3rem;
            color: var(--ink-soft);
            opacity: 0.55;
            pointer-events: none;
        }

        /* ====== GRID ====== */
        .dossier-grid {
            max-width: 1180px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        /* ====== DOSSIER CARD ====== */
        .dossier {
            position: relative;
            display: flex;
            gap: 18px;
            padding: 20px;
            background:
                repeating-linear-gradient(0deg,
                    transparent 0,
                    transparent 22px,
                    var(--paper-line) 22px,
                    var(--paper-line) 23px),
                var(--paper);
            border-radius: 2px;
            text-decoration: none;
            color: var(--ink);
            box-shadow:
                0 1px 0 var(--paper-2),
                0 12px 30px -12px rgba(0,0,0,0.7);
            transform: rotate(var(--tilt, 0deg));
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardIn 0.55s ease both;
            opacity: 0;
            overflow: hidden;
        }

        .dossier::before {
            content: "";
            position: absolute;
            top: -30px;
            right: -30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(107, 74, 42, 0.14) 0%,
                rgba(107, 74, 42, 0.06) 55%,
                transparent 72%);
            pointer-events: none;
            z-index: 0;
        }
        .dossier::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 26px 26px;
            border-color: transparent transparent rgba(42, 33, 24, 0.09) transparent;
            pointer-events: none;
        }

        .dossier:hover {
            transform: rotate(0deg) translateY(-5px);
            box-shadow:
                0 1px 0 var(--paper-2),
                0 20px 40px -12px rgba(0,0,0,0.85);
        }

        /* ====== PHOTO (holds auto cover) ====== */
        .dossier-photo {
            flex: 0 0 auto;
            width: 132px;
            height: 176px;
            background: #f5ecd5;
            padding: 4px;
            box-shadow:
                0 3px 8px rgba(0,0,0,0.35),
                0 1px 0 rgba(255,255,255,0.6) inset;
            transform: rotate(var(--photo-tilt, -1.5deg));
            position: relative;
            z-index: 1;
            align-self: flex-start;
        }

        .paperclip {
            position: absolute;
            top: -10px;
            right: 12px;
            width: 16px;
            height: 34px;
            z-index: 3;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
        }
        .paperclip svg { width: 100%; height: 100%; display: block; }

        /* ====== AUTO-GENERATED COVER ====== */
        .auto-cover {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 10px 8px;
            border-radius: 1px;
            overflow: hidden;
            background: linear-gradient(160deg, var(--c-bg1) 0%, var(--c-bg2) 100%);
            box-shadow:
                inset 0 0 0 1px rgba(0,0,0,0.35),
                inset 0 0 24px rgba(0,0,0,0.35);
        }

        /* Left spine shadow */
        .auto-cover::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(90deg, rgba(0,0,0,0.55), transparent);
            pointer-events: none;
            z-index: 2;
        }
        /* Right edge highlight */
        .auto-cover::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(270deg, rgba(255,255,255,0.08), transparent);
            pointer-events: none;
            z-index: 2;
        }

        .cover-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 1px solid var(--c-accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 6px;
            z-index: 1;
        }

        /* Inner second border */
        .cover-frame::before {
            content: "";
            position: absolute;
            inset: 2px;
            border: 1px solid var(--c-accent);
            opacity: 0.35;
            pointer-events: none;
        }

        .cover-orn {
            font-size: 0.62rem;
            color: var(--c-accent);
            letter-spacing: 2px;
            opacity: 0.9;
            line-height: 1;
        }

        .cover-title {
            font-family: 'Special Elite', 'Noto Serif Bengali', serif;
            font-size: var(--c-title-size, 0.75rem);
            color: var(--c-text);
            text-align: center;
            line-height: 1.15;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-weight: 400;
            padding: 0 2px;
            word-break: break-word;
            max-height: 60%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .cover-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 100%;
        }

        .cover-rule {
            width: 26px;
            height: 1px;
            background: var(--c-accent);
            opacity: 0.65;
        }

        .cover-rule-dot {
            width: 3px;
            height: 3px;
            background: var(--c-accent);
            transform: rotate(45deg);
            opacity: 0.8;
        }

        .cover-author {
            font-family: 'Caveat', 'Noto Serif Bengali', cursive;
            font-size: 0.68rem;
            color: var(--c-accent);
            text-align: center;
            letter-spacing: 0.3px;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            padding: 0 2px;
        }

        /* ====== DOSSIER BODY ====== */
        .dossier-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .dossier-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .case-no {
            font-family: 'Special Elite', serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--ink-soft);
            text-transform: uppercase;
        }

        .stamp-mini {
            font-family: 'Special Elite', serif;
            font-size: 0.55rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--stamp);
            border: 1.5px solid var(--stamp);
            padding: 3px 7px;
            border-radius: 2px;
            text-transform: uppercase;
            transform: rotate(-5deg);
            opacity: 0.85;
            background: rgba(255,255,255,0.15);
            white-space: nowrap;
        }

        .dossier-rule {
            height: 1px;
            background: linear-gradient(90deg, rgba(122, 31, 31, 0.45) 0%, rgba(122, 31, 31, 0.45) 40px, rgba(90, 70, 40, 0.25) 40px, rgba(90, 70, 40, 0.25) 100%);
            margin-bottom: 12px;
        }

        .dossier-title {
            font-family: 'Special Elite', 'Noto Serif Bengali', serif;
            font-size: 1.02rem;
            font-weight: 400;
            line-height: 1.25;
            color: var(--ink);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .dossier-author {
            font-family: 'Caveat', 'Noto Serif Bengali', cursive;
            font-size: 1.05rem;
            color: var(--ink-soft);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .dossier-author::before {
            content: "— ";
            opacity: 0.5;
        }

        .dossier-subtitle {
            font-family: 'Cormorant Garamond', 'Noto Serif Bengali', serif;
            font-style: italic;
            font-size: 0.85rem;
            color: rgba(90, 74, 54, 0.75);
            line-height: 1.4;
            margin-bottom: auto;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .dossier-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed rgba(90, 70, 40, 0.3);
        }

        .date-stamp {
            font-family: 'Special Elite', serif;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
        }
        .date-stamp::before {
            content: "FILED · ";
            opacity: 0.55;
        }

        .read-mark {
            font-family: 'Special Elite', serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--stamp);
            text-transform: uppercase;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .dossier:hover .read-mark {
            opacity: 1;
            transform: translateX(0);
        }

        /* ====== SKELETON ====== */
        .skeleton {
            height: 216px;
            background: linear-gradient(90deg,
                rgba(233, 221, 193, 0.08) 0%,
                rgba(233, 221, 193, 0.16) 50%,
                rgba(233, 221, 193, 0.08) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 2px;
        }

        /* ====== EMPTY ====== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 24px;
            background: var(--paper);
            border-radius: 2px;
            color: var(--ink);
            box-shadow: 0 12px 30px -12px rgba(0,0,0,0.7);
        }
        .empty-state .icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.6; }
        .empty-state h3 {
            font-family: 'Special Elite', serif;
            font-size: 0.95rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: var(--stamp);
            text-transform: uppercase;
        }
        .empty-state p {
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            color: var(--ink-soft);
        }

        /* ====== FOOTER ====== */
        footer {
            text-align: center;
            margin-top: 70px;
            color: rgba(233, 221, 193, 0.3);
            font-family: 'Special Elite', serif;
            font-size: 0.62rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        footer::before {
            content: "· · END OF INDEX · ·";
            display: block;
            margin-bottom: 14px;
            color: rgba(212, 162, 76, 0.4);
            letter-spacing: 6px;
        }

        /* ====== SCROLLBAR ====== */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0e0b08; }
        ::-webkit-scrollbar-thumb { background: #3a2a1a; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a3524; }

        /* ====== ANIMATIONS ====== */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardIn { to { opacity: 1; } }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 860px) {
            .dossier-grid { grid-template-columns: 1fr; gap: 20px; }
        }
        @media (max-width: 520px) {
            body { padding: 40px 14px 60px; }
            header { margin-bottom: 40px; }
            .header-stamp { font-size: 0.58rem; padding: 3px 8px; letter-spacing: 2px; right: 0; }
            .dept-line { font-size: 0.58rem; letter-spacing: 3px; }
            .dept-line::before, .dept-line::after { content: "·"; margin: 0 8px; }
            .dossier { padding: 16px; gap: 14px; }
            .dossier-photo { width: 105px; height: 140px; }
            .dossier-title { font-size: 0.9rem; }
            .dossier-author { font-size: 0.95rem; }
            .dossier-subtitle { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="dept-line">Bureau of Unresolved Narratives</div>
        <h1>The Epilogue Archive</h1>
        <p class="case-sub">~ a confidential dossier of curious tales ~</p>
        <div class="header-stamp">Restricted</div>
    </header>

    <div class="search-wrap">
        <label>Search the Archive</label>
        <input type="text" id="searchInput" placeholder="Enter a name, a title, or a whisper...">
    </div>

    <main class="dossier-grid" id="library"></main>

    <footer>The Epilogue Archive · Filed &amp; Sealed</footer>

    <script>
        let allBooks = [];
        const STAMPS = ['Active', 'Pending', 'Filed', 'Open', 'Cold', 'Classified', 'Ongoing'];

        /* =========================================================
           AUTO COVER COLOR PALETTES
           Each palette = a vintage book binding style
           ========================================================= */
        const COVER_PALETTES = [
            { bg1: '#4a1a1a', bg2: '#6b2828', accent: '#e0b060', text: '#f5ead0' }, // deep red leather
            { bg1: '#1a2e22', bg2: '#2e4636', accent: '#e0b060', text: '#f5ead0' }, // forest green
            { bg1: '#1a2438', bg2: '#2e3e5a', accent: '#e0b060', text: '#f5ead0' }, // navy blue
            { bg1: '#3a2418', bg2: '#5a3624', accent: '#f0c674', text: '#f5ead0' }, // brown leather
            { bg1: '#3a1c34', bg2: '#5a2a4e', accent: '#e0b060', text: '#f5ead0' }, // plum
            { bg1: '#1e1e1e', bg2: '#323232', accent: '#d4a24c', text: '#f5ead0' }, // charcoal
            { bg1: '#1a3030', bg2: '#2e4a4a', accent: '#e0b060', text: '#f5ead0' }, // teal
            { bg1: '#3a2a10', bg2: '#5a3e1a', accent: '#f0c674', text: '#f5ead0' }, // ochre
            { bg1: '#2a1a2e', bg2: '#4a2e4e', accent: '#e0b060', text: '#f5ead0' }, // violet
            { bg1: '#2e1a1a', bg2: '#4a2a1a', accent: '#f0c674', text: '#f5ead0' }, // russet
        ];

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function hash(seed) {
            let h = 0;
            for (let i = 0; i < (seed || '').length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
            return h;
        }
        function seedIdx(str, len) { return hash(str) % len; }

        /* Pick a palette based on title+author hash */
        function pickPalette(book) {
            const key = (book.title || '') + '|' + (book.author || '');
            return COVER_PALETTES[hash(key) % COVER_PALETTES.length];
        }

        /* Pick a small ornament based on title */
        const TOP_ORNS = ['❦', '✦', '❧', '✿', '◈', '❖'];
        const MID_ORNS = ['❧', '✦', '❦', '◈', '❖', '✿'];
        function pickOrnament(seed, list) {
            return list[hash(seed) % list.length];
        }

        /* Auto title font-size based on length */
        function titleSize(title) {
            const len = (title || '').length;
            if (len <= 6) return '0.9rem';
            if (len <= 10) return '0.78rem';
            if (len <= 14) return '0.7rem';
            if (len <= 20) return '0.62rem';
            if (len <= 28) return '0.55rem';
            return '0.5rem';
        }

        /* Shorten author for the cover (2 lines max) */
        function shortAuthor(author) {
            const a = (author || '').trim();
            if (!a) return 'Anonymous';
            return a;
        }

        /* Build the auto-generated cover HTML */
        function buildAutoCover(book) {
            const p = pickPalette(book);
            const size = titleSize(book.title);
            const topOrn = pickOrnament((book.id || book.title) + 'top', TOP_ORNS);
            const midOrn = pickOrnament((book.id || book.title) + 'mid', MID_ORNS);

            return `
                <div class="auto-cover"
                     style="--c-bg1:${p.bg1}; --c-bg2:${p.bg2}; --c-accent:${p.accent}; --c-text:${p.text}; --c-title-size:${size};">
                    <div class="cover-frame">
                        <div class="cover-orn">${topOrn}</div>
                        <div class="cover-title">${escapeHtml(book.title)}</div>
                        <div class="cover-mid">
                            <div class="cover-rule"></div>
                            <div class="cover-rule-dot"></div>
                            <div class="cover-rule"></div>
                        </div>
                        <div class="cover-author">${escapeHtml(shortAuthor(book.author))}</div>
                        <div class="cover-orn">${midOrn}</div>
                    </div>
                </div>`;
        }

        /* Book cover — auto-generated (no image needed) */
        function renderCover(book) {
            return buildAutoCover(book);
        }

        function caseNumber(i) { return String(i + 1).padStart(3, '0'); }

        function dateFromId(id) {
            const h = hash(id || 'x');
            const d = (h % 28) + 1;
            const m = ((h >> 5) % 12) + 1;
            const y = 2020 + ((h >> 10) % 6);
            return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${String(y).slice(-2)}`;
        }

        function buildCard(book, i) {
            const tilt = ((seedIdx(book.id + 't', 5) - 2) * 0.35).toFixed(2) + 'deg';
            const photoTilt = ((seedIdx(book.id + 'p', 5) - 2) * 0.6).toFixed(2) + 'deg';
            const stamp = STAMPS[seedIdx(book.id + 'st', STAMPS.length)];

            const a = document.createElement('a');
            a.href = `reader.html?book=${encodeURIComponent(book.id)}`;
            a.className = 'dossier';
            a.style.setProperty('--tilt', tilt);
            a.style.setProperty('--photo-tilt', photoTilt);
            a.style.animationDelay = (i * 0.045) + 's';

            a.innerHTML = `
                <div class="dossier-photo">
                    ${renderCover(book)}
                    <div class="paperclip">
                        <svg viewBox="0 0 16 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2 C4.5 2 2.5 4.5 2.5 8 L2.5 25 C2.5 29 5 31.5 8 31.5 C11 31.5 13.5 29 13.5 25 L13.5 10 C13.5 8 12.5 6.5 10.5 6.5 C8.5 6.5 7.5 8 7.5 10 L7.5 24"
                                  stroke="#8a7458" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>
                </div>
                <div class="dossier-body">
                    <div class="dossier-top">
                        <span class="case-no">CASE № ${caseNumber(i)}</span>
                        <span class="stamp-mini">${stamp}</span>
                    </div>
                    <div class="dossier-rule"></div>
                    <div class="dossier-title">${escapeHtml(book.title)}</div>
                    <div class="dossier-author">${escapeHtml(book.author)}</div>
                    <div class="dossier-subtitle">${escapeHtml(book.subtitle || '')}</div>
                    <div class="dossier-foot">
                        <span class="date-stamp">${dateFromId(book.id)}</span>
                        <span class="read-mark">Read File →</span>
                    </div>
                </div>
            `;

            return a;
        }

        function renderLibrary(books) {
            const library = document.getElementById('library');
            library.innerHTML = '';

            if (!books.length) {
                library.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🗂</div>
                        <h3>No Records Found</h3>
                        <p>the archive holds no file of that name...</p>
                    </div>`;
                return;
            }

            const frag = document.createDocumentFragment();
            books.forEach((book, i) => frag.appendChild(buildCard(book, i)));
            library.appendChild(frag);
        }

        function showSkeleton() {
            const library = document.getElementById('library');
            let html = '';
            for (let i = 0; i < 6; i++) html += '<div class="skeleton"></div>';
            library.innerHTML = html;
        }

        showSkeleton();

        fetch('./books.json')
            .then(res => res.json())
            .then(books => {
                allBooks = Array.isArray(books) ? books : [];
                renderLibrary(allBooks);

                const searchInput = document.getElementById('searchInput');
                let debounceTimer;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const q = e.target.value.toLowerCase().trim();
                        if (!q) { renderLibrary(allBooks); return; }
                        const filtered = allBooks.filter(b =>
                            (b.title || '').toLowerCase().includes(q) ||
                            (b.author || '').toLowerCase().includes(q) ||
                            (b.subtitle || '').toLowerCase().includes(q)
                        );
                        renderLibrary(filtered);
                    }, 120);
                });
            })
            .catch(err => {
                console.error("Error loading archive:", err);
                document.getElementById('library').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠</div>
                        <h3>Archive Unreachable</h3>
                        <p>the records could not be retrieved — please try again</p>
                    </div>`;
            });
    </script>
</body>
</html>
