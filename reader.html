<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Room — The Epilogue Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14110d;
            --paper: #e9ddc1;
            --ink: #2a2118;
            --ink-soft: #5a4a36;
            --red: #8a2828;
            --stamp: #7a1f1f;
            --gold: #b8915a;
            --gold-bright: #d4a24c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'Cormorant Garamond', 'Noto Serif Bengali', Georgia, serif;
            color: var(--paper);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(184, 145, 90, 0.09) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(122, 31, 31, 0.07) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* ====== TOP BAR ====== */
        .top-bar {
            position: relative;
            z-index: 3;
            background: #1a1510;
            border-bottom: 1px solid rgba(184, 145, 90, 0.25);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--paper);
            text-decoration: none;
            font-family: 'Special Elite', serif;
            font-size: 0.68rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 9px 16px;
            border: 1px solid rgba(184, 145, 90, 0.4);
            border-radius: 2px;
            background: rgba(20, 15, 10, 0.6);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .back-btn::before {
            content: "◀";
            font-size: 0.65rem;
            transition: transform 0.2s ease;
        }
        .back-btn:hover {
            border-color: var(--gold-bright);
            color: var(--gold-bright);
        }
        .back-btn:hover::before { transform: translateX(-3px); }

        .book-title-display {
            flex: 1;
            text-align: center;
            font-family: 'Special Elite', 'Noto Serif Bengali', serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--paper);
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 10px;
        }
        .book-title-display .author {
            display: block;
            font-family: 'Caveat', 'Noto Serif Bengali', cursive;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: rgba(233, 221, 193, 0.55);
            margin-top: 3px;
            text-transform: none;
        }

        .top-actions { display: flex; gap: 8px; white-space: nowrap; }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 15, 10, 0.6);
            border: 1px solid rgba(184, 145, 90, 0.35);
            border-radius: 2px;
            color: var(--paper);
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: monospace;
        }
        .icon-btn:hover {
            border-color: var(--gold-bright);
            color: var(--gold-bright);
        }

        /* ====== READER STAGE ====== */
        .reader-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .case-frame {
            position: relative;
            width: 100%;
            max-width: 1150px;
            height: 100%;
            padding: 40px 40px 28px;
            border-radius: 2px;
            background: var(--paper);
            box-shadow:
                0 1px 0 #d8caa8,
                0 30px 60px -20px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.6s ease both;
        }

        /* Folder tab */
        .case-frame::before {
            content: "CASE FILE — EVIDENCE DOCUMENT";
            position: absolute;
            top: -18px;
            left: 28px;
            padding: 6px 16px 5px;
            background: #d8caa8;
            border-radius: 3px 5px 0 0;
            font-family: 'Special Elite', serif;
            font-size: 0.58rem;
            letter-spacing: 2.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            box-shadow: 0 -1px 2px rgba(0,0,0,0.15);
        }

        .case-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(90, 70, 40, 0.35);
            position: relative;
            flex-wrap: wrap;
        }
        .case-meta::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 55px;
            height: 2px;
            background: var(--stamp);
            opacity: 0.7;
        }

        .meta-item {
            font-family: 'Special Elite', serif;
            font-size: 0.62rem;
            letter-spacing: 2px;
            color: var(--ink-soft);
            text-transform: uppercase;
        }
        .meta-item strong {
            color: var(--ink);
            font-weight: 400;
            margin-left: 5px;
            letter-spacing: 1.2px;
        }

        .doc-viewer {
            position: relative;
            flex: 1;
            background: #f5ecd5;
            border: 1px solid rgba(90, 70, 40, 0.3);
            overflow: hidden;
            padding: 5px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #f5ecd5;
            display: block;
        }

        /* ====== LOADING ====== */
        .loading-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #f5ecd5;
            z-index: 4;
            color: var(--ink-soft);
        }

        .loading-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--stamp);
            box-shadow: 0 0 0 0 rgba(122, 31, 31, 0.5);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(122, 31, 31, 0.55); }
            70% { box-shadow: 0 0 0 18px rgba(122, 31, 31, 0); }
            100% { box-shadow: 0 0 0 0 rgba(122, 31, 31, 0); }
        }

        .loading-text {
            font-family: 'Special Elite', serif;
            font-size: 0.72rem;
            letter-spacing: 4px;
            color: var(--ink);
            text-transform: uppercase;
        }

        /* ====== ERROR ====== */
        .error-state {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #f5ecd5;
            z-index: 6;
            text-align: center;
            padding: 30px;
            color: var(--ink);
        }
        .error-state.show { display: flex; }
        .error-state .stamp-big {
            font-family: 'Special Elite', serif;
            font-size: 1.05rem;
            letter-spacing: 5px;
            color: var(--stamp);
            border: 2.5px solid var(--stamp);
            padding: 7px 18px;
            border-radius: 2px;
            text-transform: uppercase;
            transform: rotate(-3deg);
            opacity: 0.85;
        }
        .error-state h2 {
            font-family: 'Special Elite', 'Noto Serif Bengali', serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--ink);
            text-transform: uppercase;
            margin-top: 6px;
        }
        .error-state p {
            font-family: 'Caveat', 'Noto Serif Bengali', cursive;
            font-size: 1.15rem;
            color: var(--ink-soft);
            max-width: 400px;
            line-height: 1.5;
        }
        .error-state a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 9px 20px;
            border: 1px solid var(--stamp);
            color: var(--stamp);
            text-decoration: none;
            font-family: 'Special Elite', serif;
            font-size: 0.62rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        .error-state a:hover {
            background: rgba(122, 31, 31, 0.1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 700px) {
            .top-bar { padding: 10px 12px; gap: 8px; }
            .back-btn { padding: 8px 12px; font-size: 0; letter-spacing: 0; }
            .back-btn::before { font-size: 0.8rem; }
            .book-title-display { font-size: 0.78rem; letter-spacing: 1px; }
            .book-title-display .author { font-size: 0.78rem; }
            .icon-btn { width: 32px; height: 32px; font-size: 0.85rem; }
            .reader-stage { padding: 10px; }
            .case-frame { padding: 26px 14px 16px; }
            .case-frame::before { left: 12px; font-size: 0.5rem; padding: 5px 10px; letter-spacing: 2px; }
            .case-meta { gap: 6px; padding-bottom: 10px; margin-bottom: 12px; }
            .meta-item { font-size: 0.52rem; letter-spacing: 1.2px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">Archive</a>

        <div class="book-title-display" id="current-title">
            Opening file…
            <span class="author" id="current-author"></span>
        </div>

        <div class="top-actions">
            <a href="#" class="icon-btn" id="openOriginal" title="Open in new tab" target="_blank" rel="noopener">⤢</a>
            <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
            <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <div class="reader-stage">
        <div class="case-frame">

            <div class="case-meta">
                <div class="meta-item">Case No. <strong id="metaCase">—</strong></div>
                <div class="meta-item">Subject <strong id="metaAuthor">—</strong></div>
                <div class="meta-item">Filed <strong id="metaDate">—</strong></div>
                <div class="meta-item">Status <strong style="color: var(--stamp);">Open</strong></div>
            </div>

            <div class="doc-viewer" id="docViewer">
                <div class="loading-state" id="loadingState">
                    <div class="loading-dot"></div>
                    <div class="loading-text">Retrieving file</div>
                </div>

                <div class="error-state" id="errorState">
                    <div class="stamp-big">Not Found</div>
                    <h2>File Missing From Archive</h2>
                    <p id="errorMessage">This volume is not present in the records.</p>
                    <a href="index.html">◀ Return to Archive</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('book');

        const docViewer = document.getElementById('docViewer');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const titleEl = document.getElementById('current-title');
        const authorEl = document.getElementById('current-author');
        const metaCase = document.getElementById('metaCase');
        const metaAuthor = document.getElementById('metaAuthor');
        const metaDate = document.getElementById('metaDate');
        const openOriginal = document.getElementById('openOriginal');
        const refreshBtn = document.getElementById('refreshBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        function cleanUrl(u) { return (u || '').trim().replace(/^["']|["']$/g, ''); }
        function hash(seed) {
            let h = 0;
            for (let i = 0; i < (seed || '').length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
            return h;
        }
        function caseNumberFromId(id) {
            return 'CA-' + String(hash(id) % 9000 + 1000).padStart(4, '0');
        }
        function dateFromId(id) {
            const h = hash(id || 'x');
            const d = (h % 28) + 1;
            const m = ((h >> 5) % 12) + 1;
            const y = 2020 + ((h >> 10) % 6);
            return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
        }

        function showError(msg) {
            loadingState.style.display = 'none';
            errorState.classList.add('show');
            if (msg) errorMessage.textContent = msg;
        }

        function mountIframe(src) {
            const iframe = document.createElement('iframe');
            iframe.src = src;
            iframe.allow = 'autoplay; fullscreen';
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.loading = 'eager';
            iframe.addEventListener('load', () => {
                loadingState.style.opacity = '0';
                loadingState.style.transition = 'opacity 0.4s ease';
                setTimeout(() => loadingState.style.display = 'none', 420);
            });
            docViewer.appendChild(iframe);
            openOriginal.href = src;
        }

        if (!bookId) {
            titleEl.textContent = 'No file selected';
            showError('No case number found in the request. Return to the archive and select a file.');
        } else {
            fetch('./books.json')
                .then(res => res.json())
                .then(books => {
                    const book = (books || []).find(b => b.id === bookId);
                    if (!book) {
                        titleEl.textContent = 'File not found';
                        showError('This case file does not exist in the archive.');
                        return;
                    }

                    document.title = `${book.title} — Case File`;
                    titleEl.textContent = book.title;
                    if (book.author) authorEl.textContent = 'subject: ' + book.author;

                    metaCase.textContent = caseNumberFromId(book.id);
                    metaAuthor.textContent = book.author || '—';
                    metaDate.textContent = dateFromId(book.id);

                    const pdfUrl = cleanUrl(book.pdf);
                    if (!pdfUrl) { showError('This case file has no attached document.'); return; }

                    mountIframe(pdfUrl);
                })
                .catch(err => {
                    console.error('Error loading case file:', err);
                    titleEl.textContent = 'Archive error';
                    showError('The records could not be retrieved. Please try again.');
                });
        }

        refreshBtn.addEventListener('click', () => window.location.reload());
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.().catch(() => {});
            } else {
                document.exitFullscreen?.();
            }
        });
    </script>
</body>
</html>
